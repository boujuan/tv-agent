# ~/.config/tv-agent/config.toml (optional: these are the defaults). Secrets live in secrets.toml next to it,
# written by `tv-agent setup token|stremio|kodi|liquid|openrouter`, never here.

tv_hosts = ["192.168.1.41", "192.168.1.40"]   # Ethernet, Wi-Fi; also the only addresses the LAN listener accepts
lan_host = "192.168.1.51"                     # this laptop on bond0; never 0.0.0.0 (tailscale0 is up too).
                                              # Empty: the route to the TV's, followed while the agent runs
lan_port = 8765
local_port = 8766
stream_port = 8767         # the TV app's live audio
phones = true              # paired phones (the TV Agent phone app): HTTPS on phone_port, live audio on phone_stream_port
phone_port = 8768
phone_stream_port = 8769
phone_hosts = []           # more addresses for the phones' listeners besides lan_host, e.g. ["100.125.125.38"] (Tailscale)
d1_url = "http://127.0.0.1:8091"
kodi_port = 8080
kodi_user = "kodi"

player = "kodi"            # "tvplayer" for TV Agent Player (github.com/boujuan/tv-agent-player: fastest, exact jumps,
                           # tracks by name, add-on subtitles; `tv-agent tv install` + `tv-agent tv pair`),
                           # "kodi" for Kodi, "just" for Just Player (simpler; fewer controls)
# player_port = 8770       # TV Agent Player connects here (TLS with the phones' certificate, its own token), on
                           # the LAN address, phone_hosts and this computer's Tailscale address
max_height = 2160          # largest resolution to pick
max_mbps = 60.0            # skip files whose bitrate the TV's 100 Mbit/s port can't carry; 0: no limit
probe_streams = true       # check a debrid link answers before handing it to Kodi; false while the TV uses a VPN

# Tracks: titles made in your native language play in it; everything else in audio_language ("original": the
# language it was made in) when the file has it, and streams with it come first. Subtitles in this order, shown
# per `subtitles`: "foreign" only while the audio isn't native_language, "always" or "off". Also by voice ("from now
# on, audio in Spanish", "a partir de ahora sin subtítulos"), in the panel and from the phone.
audio_language = "eng"
subtitle_languages = ["eng", "spa"]
subtitles = "foreign"
native_language = "spa"

twitch_favorites = []      # e.g. ["ibai", "auronplay"]: matched first, since speech-to-text spells names freely
log_transcripts = true     # what you said, in `journalctl --user -u tv-agent`
check_episodes = true      # each episode's file checked by its subtitles: a streaming rip's numbering can differ
updates = "notify"         # GitHub releases: "notify" checks every 6 h, "auto" also installs the TV app's, "off"

stt_model = "parakeet-v2"  # speech: "parakeet-v2" (English) or "parakeet-v3" (25 languages; `tv-agent setup stt`)
stt_where = "local"        # "local" (this laptop), "hosted" (OpenRouter, the recording when you pause), or
                           # "local-first" / "hosted-first" (the other when the first fails or this laptop hears nothing);
                           # hosted needs the OpenRouter key
stt_hosted_model = "mistralai/voxtral-mini-transcribe-3-0"   # any OpenRouter transcription model id
keep_recordings = false    # keep each spoken command's audio (the last 300) to replay or transcribe again (Activity)
stt_language = "native"    # the hosted model's language hint: "native" (native_language), "" (it guesses) or "es", "en"…
stt_vocabulary = ["Stremio", "TizenTube", "YouTube", "YouTube Music", "Kodi", "Twitch", "Movistar Plus", "Prime Video",
                  "RTVE Play", "TDTChannels"]   # names the hosted model should hear as written (AssemblyAI)
# A language hint's own names, used instead of stt_vocabulary while that hint is on (the names' language leans how
# borderline words come out); a hint without its own list, and no hint, use stt_vocabulary
# stt_vocabularies = {es = ["Movistar Plus", "RTVE Play"], en = ["Peacock"]}
stt_vocabulary_library = true   # plus your library's titles and Twitch favourites
binge = true               # when an episode ends, the next one starts ("binge mode on / off")
auto_skip = false          # skip intros and recaps by themselves when their timestamps are sure ("auto skip on")

# How a command is decided (the panel's Decisions tab changes these live): the steps, in order, and the ones off
decide_steps = ["phrases", "patterns", "llm", "d1"]
decide_off = []
# Which d1 answers: "local-first", "hosted-first", "local" or "hosted" (Liquid's, with `tv-agent setup liquid`)
d1_where = "local-first"
hosted_d1_model = "d1"     # "d1" / "d1-ultra" (Liquid's API), or an OpenRouter decision model ("typesafe/jev-1.14")
# The LLM step, with `tv-agent setup openrouter`: any OpenRouter model that supports structured outputs
llm_model = "deepseek/deepseek-v4.1-flash-1017"
llm_reasoning = "none"     # reasoning effort: "none" (off where the model allows, else its lowest), "minimal", "low"…
llm_private = false        # true: only providers that keep no data
