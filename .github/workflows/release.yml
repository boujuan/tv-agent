# A component tag (server-vX.Y.Z, panel-vX.Y.Z, android-vX.Y.Z) builds that component and publishes a GitHub
# Release with its artifacts and its CHANGELOG section. See RELEASING.md.
name: Release

on:
  push:
    tags: ["server-v*", "panel-v*", "android-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the tag
        id: tag
        run: |
          echo "component=${GITHUB_REF_NAME%%-v*}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#*-v}" >> "$GITHUB_OUTPUT"

      # ---- server: wheel and sdist
      - if: steps.tag.outputs.component == 'server'
        uses: astral-sh/setup-uv@v10.3.2
      - if: steps.tag.outputs.component == 'server'
        working-directory: server
        run: |
          have=$(sed -n 's/^version = "\(.*\)".*/\1/p' pyproject.toml)
          [ "$have" = "${{ steps.tag.outputs.version }}" ] || { echo "pyproject.toml says $have"; exit 1; }
          uv build --out-dir ../dist

      # ---- panel: source tarball (the AUR recipe installs from it)
      - if: steps.tag.outputs.component == 'panel'
        run: |
          v="${{ steps.tag.outputs.version }}"
          have=$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' panel/tvpanel/__init__.py)
          [ "$have" = "$v" ] || { echo "panel/tvpanel/__init__.py says $have"; exit 1; }
          mkdir -p dist
          tar --exclude='__pycache__' --transform "s,^,tv-agent-panel-$v/," -czf "dist/tv-agent-panel-$v.tar.gz" panel LICENSE

      # ---- android: the APK, signed with the release key from the repo secrets (see RELEASING.md)
      - if: steps.tag.outputs.component == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - if: steps.tag.outputs.component == 'android'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TV_AGENT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TV_AGENT_KEY_ALIAS: tv-agent
          # The release key's certificate: an APK signed with any other key isn't published.
          CERT_SHA256: bd934e07d6784766bbfb3948bf3467ef9b2cb0c9c1146fdf9528dc76c8eb1e08
        run: |
          v="${{ steps.tag.outputs.version }}"
          have=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)
          [ "$have" = "$v" ] || { echo "app/build.gradle says $have"; exit 1; }
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "the ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          export TV_AGENT_KEYSTORE="$RUNNER_TEMP/release.p12"
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$TV_AGENT_KEYSTORE"
          ./gradlew assembleRelease --console=plain
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # Newer build-tools name the signer differently ("Signer #1", "Signer (minSdkVersion=…)"): match the digest.
          certs=$("$apksigner" verify --print-certs "$apk" 2>&1) || { echo "$certs"; exit 1; }
          grep -qE "certificate SHA-256 digest: $CERT_SHA256\s*$" <<< "$certs" \
            || { echo "$apk isn't signed with the release key:"; grep -i "signer" <<< "$certs"; exit 1; }
          mkdir -p ../dist
          cp "$apk" "../dist/tv-agent-android-$v.apk"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/release-notes.sh "${{ steps.tag.outputs.component }}" "${{ steps.tag.outputs.version }}" > notes.md
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "${{ steps.tag.outputs.component }} ${{ steps.tag.outputs.version }}" --notes-file notes.md
