plugins {
    id 'com.android.application'
}

// The release key, where it's configured: Gradle properties (~/.gradle/gradle.properties on a computer that has the
// key) or environment variables (the release workflow) of the same names. See RELEASING.md.
def releaseKey = { String name -> findProperty(name) ?: System.getenv(name) }

android {
    namespace 'com.boujuan.tvagent'
    compileSdk 34

    defaultConfig {
        applicationId 'com.boujuan.tvagent'
        // The living-room TCL runs Android 14; nothing older needs this app.
        minSdk 34
        targetSdk 34
        // Released as android-v<versionName> tags (see RELEASING.md); bump versionCode with every release.
        versionCode 10
        versionName '0.9.0'
    }

    signingConfigs {
        if (releaseKey('TV_AGENT_KEYSTORE')) {
            release {
                storeFile file(releaseKey('TV_AGENT_KEYSTORE'))
                storePassword releaseKey('TV_AGENT_KEYSTORE_PASSWORD')
                keyAlias releaseKey('TV_AGENT_KEY_ALIAS')
                // keytool's PKCS12 keystores have one password for the store and the key.
                keyPassword releaseKey('TV_AGENT_KEY_PASSWORD') ?: releaseKey('TV_AGENT_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // No libraries to shrink: plain Java on the platform API only.
            minifyEnabled false
            // The release key if configured, else the debug key (CI on branches, a computer without the key): that APK
            // still builds and installs, but can't update an install signed with the release key, nor the other way round.
            signingConfig releaseKey('TV_AGENT_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
